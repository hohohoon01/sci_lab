<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#155e75">
  <title>강동중 과학실 예약</title>
  <style>
    :root{
      --bg:#f4f7fb;--card:#fff;--line:#dbe4ee;--text:#172033;--muted:#64748b;
      --primary:#155e75;--primary2:#0e7490;--danger:#dc2626;--ok:#047857;
      --shadow:0 8px 30px rgba(15,23,42,.08);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
    body{overflow-x:hidden}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    input,select,textarea{font-size:16px}
    .app{min-height:100vh;display:grid;grid-template-columns:190px minmax(0,1fr)}
    .sidebar{background:#0f172a;color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}
    .brand{font-size:20px;font-weight:900;line-height:1.35;margin:2px 6px 22px}
    .brand small{display:block;color:#a8b6cb;font-size:12px;font-weight:500;margin-top:6px}
    .room-tab,.side-btn{width:100%;border:0;border-radius:12px;padding:13px 12px;margin:5px 0;text-align:left;background:transparent;color:#dbe7f4;font-weight:800;min-height:46px}
    .room-tab:hover,.side-btn:hover{background:rgba(255,255,255,.08)}
    .room-tab.active{background:#fff;color:#0f172a}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:#22c55e}
    .room-tab[data-room="과학2실"] .dot{background:#60a5fa}
    .sep{height:1px;background:rgba(255,255,255,.13);margin:16px 4px}
    .content{padding:22px;min-width:0;display:flex;flex-direction:column;min-height:100vh}
    .topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
    h1{font-size:25px;margin:0 0 5px}.subtitle{margin:0;color:var(--muted);font-size:14px}
    .status{padding:8px 11px;border-radius:999px;background:#ecfdf5;color:var(--ok);font-size:12px;font-weight:800;white-space:nowrap}
    .status.warn{background:#fff7ed;color:#b45309}.status.error{background:#fef2f2;color:#b91c1c}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
    .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px}
    .btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 13px;border-radius:10px;font-weight:800;min-height:42px}
    .btn:hover{background:#f8fafc}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.btn.small{padding:7px 9px;font-size:12px;min-height:34px}
    .week-label{font-weight:900;min-width:190px;text-align:center}.spacer{flex:1}
    input,select,textarea{width:100%;border:1px solid #cdd7e2;background:#fff;border-radius:10px;padding:10px 11px;color:var(--text)}
    textarea{min-height:92px;resize:vertical}.date-input{width:auto}
    .notice{display:none;margin:0 0 14px;padding:12px 14px;border-radius:12px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;line-height:1.55;font-size:13px}
    .notice.show{display:block}
    .table-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
    table{width:100%;border-collapse:separate;border-spacing:0;min-width:900px}
    th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
    th:last-child,td:last-child{border-right:0}
    thead th{background:#f8fafc;padding:11px 8px;text-align:center;font-size:13px;position:sticky;top:0;z-index:2}
    .period-head{width:76px}.period-cell{background:#fbfdff;text-align:center;font-weight:900;padding:12px 7px;white-space:nowrap;position:sticky;left:0;z-index:1}
    .slot{min-height:92px;padding:8px;background:#fff;display:flex;align-items:center;justify-content:center}
    .slot.today{box-shadow:inset 0 3px 0 #22c55e}
    .add-btn{width:44px;height:44px;border-radius:50%;border:1px dashed #94a3b8;background:#f8fafc;color:#64748b;font-size:25px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
    .add-btn:hover{background:#ecfeff;border-color:#0891b2;color:#0e7490}
    .reservation{width:100%;align-self:stretch;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:8px;font-size:12px;line-height:1.4;color:#1e3a8a;word-break:keep-all}
    .reservation b{display:block;font-size:13px;margin-bottom:3px;color:#1e40af}
    .mobile-room-bar{display:none}
    .modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,.60);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
    .modal-backdrop.open{display:flex}
    .modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 25px 80px rgba(0,0,0,.28)}
    .modal.large{width:min(1080px,100%)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
    .modal-head h2{font-size:19px;margin:0}.x{border:0;background:transparent;font-size:28px;color:#64748b;min-width:44px;min-height:44px}
    .modal-body{padding:18px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff;z-index:2;padding-bottom:calc(14px + var(--safe-bottom))}
    .summary{padding:11px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;line-height:1.5}
    .field{margin-bottom:12px}.field label{display:block;font-size:12px;color:#475569;font-weight:900;margin:0 0 6px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:12px;color:#64748b;line-height:1.5}
    .step-label{font-size:13px;font-weight:900;margin:0 0 9px;color:#334155}
    .teacher-button-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .teacher-choice{border:2px solid transparent;border-radius:999px;padding:10px 14px;font-weight:900;color:#0f172a;min-height:42px}
    .teacher-choice.active{outline:3px solid rgba(15,23,42,.18);transform:translateY(-1px)}
    .teacher-choice.c0{background:#fee2e2}.teacher-choice.c1{background:#ffedd5}.teacher-choice.c2{background:#fef3c7}
    .teacher-choice.c3{background:#dcfce7}.teacher-choice.c4{background:#ccfbf1}.teacher-choice.c5{background:#dbeafe}
    .teacher-choice.c6{background:#ede9fe}.teacher-choice.c7{background:#fae8ff}.teacher-choice.manual{background:#e2e8f0}
    .slot-info{border-radius:12px;padding:11px 12px;margin-bottom:12px;font-size:13px;line-height:1.5}
    .slot-info.empty{background:#f8fafc;border:1px solid var(--line);color:#64748b}
    .slot-info.positive{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
    .slot-info.negative{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
    .admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.admin-tab.active{background:#0f172a;color:#fff;border-color:#0f172a}
    .admin-section{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}.admin-section h3{margin:0 0 10px;font-size:16px}
    .admin-row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.admin-row .grow{flex:1;min-width:210px}
    .teacher-list{display:grid;gap:8px;margin-top:12px}.teacher-item{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fbfdff}
    .teacher-meta{font-size:12px;color:#64748b;margin-top:3px}
    .preview{max-height:380px;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}.preview table{min-width:720px}
    .preview th,.preview td{padding:8px;font-size:12px;vertical-align:top}.preview-empty{padding:22px;text-align:center;color:#64748b}
    .toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#0f172a;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:var(--shadow);display:none;max-width:420px}
    .toast.show{display:block}.toast.error{background:#991b1b}
    .footer{margin-top:auto;padding:22px 4px 2px;text-align:center;font-size:10px;color:#94a3b8;letter-spacing:.2px}

    /* 태블릿 */
    @media (max-width:1024px){
      .app{grid-template-columns:150px minmax(0,1fr)}
      .sidebar{padding:16px 10px}.brand{font-size:18px}.content{padding:16px}
      .room-tab,.side-btn{padding:12px 10px}
      .modal.large{width:min(94vw,1000px)}
      .teacher-item{grid-template-columns:1fr auto auto}.teacher-item .delete-teacher{grid-column:3}
    }

    /* 휴대폰 */
    @media (max-width:760px){
      .app{display:block}.sidebar{display:none}.content{padding:12px;min-height:100svh}
      .mobile-room-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;position:sticky;top:0;z-index:20;background:var(--bg);padding-top:4px}
      .mobile-room-bar .room-tab{margin:0;background:#e2e8f0;color:#334155;text-align:center;min-height:46px}
      .mobile-room-bar .room-tab.active{background:#155e75;color:#fff}
      .topbar{align-items:center}.topbar h1{font-size:20px}.subtitle{font-size:12px}.status{font-size:11px;padding:7px 9px}
      .panel{border-radius:12px}.toolbar{padding:10px;gap:6px}.toolbar .btn{flex:1;min-width:90px}
      .week-label{order:-1;width:100%;text-align:left;min-width:0}.spacer{display:none}.date-input{width:100%;max-width:none}
      table{min-width:700px}.period-head{width:62px}.slot{min-height:82px;padding:6px}.add-btn{width:46px;height:46px}
      .modal-backdrop{padding:0;align-items:flex-end}
      .modal,.modal.large{width:100%;max-height:94svh;border-radius:18px 18px 0 0}
      .modal-body{padding:14px}.modal-head{padding:13px 14px}.modal-actions{padding:12px 14px calc(12px + var(--safe-bottom))}
      .modal-actions .btn{flex:1}.grid2{grid-template-columns:1fr}.teacher-choice{padding:10px 13px}
      .admin-tabs{display:grid;grid-template-columns:1fr 1fr}.admin-tab{width:100%}
      .admin-row{align-items:stretch}.admin-row .grow{min-width:100%;width:100%}.admin-row .btn{flex:1}
      .teacher-item{grid-template-columns:1fr 1fr}.teacher-item .teacher-main{grid-column:1/-1}.teacher-item .import-teacher,.teacher-item .preview-teacher,.teacher-item .delete-teacher{width:100%}
      .toast{left:12px;right:12px;bottom:calc(12px + var(--safe-bottom));max-width:none}
      .footer{padding-bottom:calc(4px + var(--safe-bottom))}
    }

    /* 아주 작은 휴대폰 */
    @media (max-width:420px){
      .content{padding:9px}.topbar{gap:8px}.topbar h1{font-size:18px}.status{font-size:10px}
      .toolbar .btn{font-size:12px;padding:9px 8px;min-width:0}.week-label{font-size:13px}
      .teacher-button-grid{gap:6px}.teacher-choice{font-size:13px;padding:9px 11px}
      .admin-tabs{gap:6px}.admin-tab{font-size:12px;padding:9px 7px}
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">🧪 강동중 과학실 예약<small>Science Lab Reservation</small></div>
    <button class="room-tab active" data-room="과학1실"><span class="dot"></span>과학1실</button>
    <button class="room-tab" data-room="과학2실"><span class="dot"></span>과학2실</button>
    <div class="sep"></div>
    <button class="side-btn" id="refreshBtn">↻ 새로고침</button>
    <button class="side-btn" id="adminBtn">⚙ 관리자</button>
  </aside>

  <main class="content">
    <div class="mobile-room-bar">
      <button class="room-tab active" data-room="과학1실">과학1실</button>
      <button class="room-tab" data-room="과학2실">과학2실</button>
    </div>

    <div class="topbar">
      <div>
        <h1 id="pageTitle">강동중 과학실 예약 · 과학1실</h1>
        <p class="subtitle">원하는 날짜와 교시의 + 버튼을 눌러 예약하세요.</p>
      </div>
      <div id="connectionStatus" class="status warn">연결 중</div>
    </div>

    <div id="connectionNotice" class="notice"></div>

    <section class="panel">
      <div class="toolbar">
        <button class="btn" id="prevWeekBtn">← 이전 주</button>
        <button class="btn" id="todayBtn">이번 주</button>
        <button class="btn" id="nextWeekBtn">다음 주 →</button>
        <span class="week-label" id="weekLabel"></span>
        <span class="spacer"></span>
        <input class="date-input" id="datePicker" type="date">
      </div>
      <div class="table-wrap" id="scheduleArea"></div>
    </section>

    <footer class="footer">Copyright © HOHOHOON T</footer>
  </main>
</div>

<div class="modal-backdrop" id="reservationModal">
  <div class="modal">
    <div class="modal-head"><h2>과학실 예약</h2><button class="x" data-close="reservationModal">×</button></div>
    <div class="modal-body">
      <div id="reservationSummary" class="summary"></div>
      <div class="step-label">1. 교사를 먼저 선택하세요</div>
      <div id="teacherButtonGrid" class="teacher-button-grid"></div>
      <div id="teacherScheduleStatus" class="slot-info empty">교사를 선택하면 이 시간에 수업이 있는지 표시됩니다.</div>
      <div id="scheduledLessonFields" style="display:none">
        <div class="field"><label for="scheduledLessonSelect">2. 수업 선택</label><select id="scheduledLessonSelect"><option value="">수업을 선택하세요</option></select></div>
      </div>
      <div id="manualTeacherFields" style="display:none">
        <div class="field"><label for="manualTeacherInput">교사명 직접 입력</label><input id="manualTeacherInput" type="text" placeholder="교사명"></div>
      </div>
      <div id="manualLessonFields" style="display:none">
        <div class="grid2">
          <div class="field"><label for="manualSubjectInput">과목/수업명</label><input id="manualSubjectInput" type="text" placeholder="예: 과학, 물리"></div>
          <div class="field"><label for="manualClassInput">학급</label><input id="manualClassInput" type="text" placeholder="예: 2-3"></div>
        </div>
      </div>
      <div class="field"><label for="experimentInput">3. 실험 내용</label><textarea id="experimentInput" placeholder="예: 산-염기 중화 반응 실험"></textarea></div>
    </div>
    <div class="modal-actions"><button class="btn" data-close="reservationModal">취소</button><button class="btn primary" id="saveReservationBtn">예약하기</button></div>
  </div>
</div>

<div class="modal-backdrop" id="adminLoginModal">
  <div class="modal">
    <div class="modal-head"><h2>관리자 인증</h2><button class="x" data-close="adminLoginModal">×</button></div>
    <div class="modal-body"><div class="field"><label for="adminPasswordInput">관리자 비밀번호</label><input id="adminPasswordInput" type="password" placeholder="비밀번호"></div></div>
    <div class="modal-actions"><button class="btn" data-close="adminLoginModal">취소</button><button class="btn primary" id="adminLoginBtn">확인</button></div>
  </div>
</div>

<div class="modal-backdrop" id="adminModal">
  <div class="modal large">
    <div class="modal-head"><h2>관리자 페이지</h2><button class="x" data-close="adminModal">×</button></div>
    <div class="modal-body">
      <div class="admin-tabs">
        <button class="btn admin-tab active" data-panel="teachersPanel">교사 관리</button>
        <button class="btn admin-tab" data-panel="schedulePanel">시간표 확인</button>
        <button class="btn admin-tab" data-panel="reservationsPanel">예약 관리</button>
        <button class="btn admin-tab" data-panel="settingsPanel">설정</button>
      </div>

      <div id="teachersPanel" class="admin-panel">
        <div class="admin-section">
          <h3>현재 과학 교사</h3>
          <div class="admin-row">
            <div class="grow"><input id="newTeacherInput" type="text" placeholder="Google Sheet 탭 이름과 동일한 교사 이름"></div>
            <button class="btn primary" id="addTeacherBtn">교사 추가</button>
            <button class="btn" id="importAllBtn">전체 시간표 불러오기</button>
          </div>
          <div class="hint" style="margin-top:8px">교사 이름과 같은 Google Sheet 탭에서 시간표를 읽습니다. 예: 이정훈 교사 → 이정훈 시트 탭.</div>
          <div id="teacherList" class="teacher-list"></div>
        </div>
      </div>

      <div id="schedulePanel" class="admin-panel" style="display:none">
        <div class="admin-section"><h3>불러온 교사 시간표</h3><div id="schedulePreview" class="preview"></div></div>
      </div>

      <div id="reservationsPanel" class="admin-panel" style="display:none">
        <div class="admin-section"><h3>예약 관리</h3><div id="reservationAdminList" class="preview"></div></div>
      </div>

      <div id="settingsPanel" class="admin-panel" style="display:none">
        <div class="admin-section">
          <h3>관리자 비밀번호 변경</h3>
          <div class="grid2">
            <div class="field"><label for="newAdminPasswordInput">새 비밀번호</label><input id="newAdminPasswordInput" type="password"></div>
            <div class="field"><label for="confirmAdminPasswordInput">새 비밀번호 확인</label><input id="confirmAdminPasswordInput" type="password"></div>
          </div>
          <button class="btn primary" id="changePasswordBtn">비밀번호 변경</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
'use strict';

const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxOAmgN4pNpBh1MvfojjxXaqjAWwHpeQU5w7wDIHnV7WfkZfb9VyPXbbTIQYmvV4Hi7/exec';
const EXPECTED_API_VERSION = 'gangdong-science-v4';
const DAYS = ['월','화','수','목','금'];
const MAX_PERIOD = 7;

let currentRoom = '과학1실';
let currentMonday = getMonday(new Date());
let reservations = [];
let teachers = [];
let importedSchedules = [];
let selectedSlot = null;
let selectedTeacher = '';
let selectedLessons = [];
let adminPasswordSession = '';

const $ = id => document.getElementById(id);
function pad(n){return String(n).padStart(2,'0')}
function formatDate(date){const d=new Date(date);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseDateLocal(value){const [y,m,d]=value.split('-').map(Number);return new Date(y,m-1,d,12,0,0)}
function addDays(date,days){const d=new Date(date);d.setDate(d.getDate()+days);return d}
function getMonday(date){const d=new Date(date);d.setHours(12,0,0,0);const day=d.getDay();d.setDate(d.getDate()+(day===0?-6:1-day));return d}
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function setStatus(text,type='ok'){const el=$('connectionStatus');el.textContent=text;el.className='status'+(type==='warn'?' warn':type==='error'?' error':'')}
function showConnectionNotice(message=''){const el=$('connectionNotice');if(!message){el.classList.remove('show');el.innerHTML='';return}el.classList.add('show');el.innerHTML=message}
function toast(message,error=false){const el=$('toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(toast._timer);toast._timer=setTimeout(()=>el.className='toast',3500)}
function openModal(id){$(id).classList.add('open')}
function closeModal(id){$(id).classList.remove('open')}
function normalizeApiError(error){const text=String(error&&error.message?error.message:error);if(text.includes('알 수 없는 action')||text.includes('getAdminData'))return '배포된 Google Apps Script가 이전 버전입니다. 새 Code.gs를 넣은 뒤 배포 관리에서 새 버전으로 다시 배포해야 합니다.';if(text.includes('Failed to fetch'))return 'Google Apps Script에 연결할 수 없습니다. 웹앱 접근 권한이 모든 사용자(Anyone)인지 확인해 주세요.';return text}

async function apiGet(action,params={}){
  const url=new URL(GOOGLE_APPS_SCRIPT_URL);url.searchParams.set('action',action);Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));url.searchParams.set('_',Date.now());
  const response=await fetch(url.toString(),{method:'GET',redirect:'follow',cache:'no-store'});const text=await response.text();let data;
  try{data=JSON.parse(text)}catch{throw new Error('Apps Script 응답이 JSON이 아닙니다. 웹앱 배포 설정을 확인해 주세요.')}
  if(!response.ok||data.ok===false)throw new Error(data.error||`서버 오류 ${response.status}`);return data;
}

async function apiPost(action,payload={}){
  const response=await fetch(GOOGLE_APPS_SCRIPT_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...payload})});
  const text=await response.text();let data;try{data=JSON.parse(text)}catch{throw new Error('Apps Script 응답이 JSON이 아닙니다. 웹앱 배포 설정을 확인해 주세요.')}
  if(!response.ok||data.ok===false)throw new Error(data.error||`서버 오류 ${response.status}`);return data;
}

function updateHeader(){const end=addDays(currentMonday,4);$('weekLabel').textContent=`${currentMonday.getFullYear()}.${pad(currentMonday.getMonth()+1)}.${pad(currentMonday.getDate())} ~ ${pad(end.getMonth()+1)}.${pad(end.getDate())}`;$('datePicker').value=formatDate(currentMonday);$('pageTitle').textContent=`강동중 과학실 예약 · ${currentRoom}`}
function getReservation(date,period){return reservations.find(r=>String(r.date)===date&&Number(r.period)===Number(period)&&String(r.room||'과학1실')===currentRoom)}
function renderSchedule(){
  updateHeader();let html='<table><thead><tr><th class="period-head">교시</th>';
  for(let dayIndex=0;dayIndex<5;dayIndex++){const d=addDays(currentMonday,dayIndex);html+=`<th>${DAYS[dayIndex]}요일<br><span style="font-weight:500;color:#64748b">${pad(d.getMonth()+1)}/${pad(d.getDate())}</span></th>`}
  html+='</tr></thead><tbody>';const today=formatDate(new Date());
  for(let period=1;period<=MAX_PERIOD;period++){html+=`<tr><td class="period-cell">${period}교시</td>`;for(let dayIndex=0;dayIndex<5;dayIndex++){const date=formatDate(addDays(currentMonday,dayIndex));const r=getReservation(date,period);html+=`<td><div class="slot ${date===today?'today':''}">`;if(r){const lesson=[r.subject,r.className].filter(Boolean).join(' · ');html+=`<div class="reservation"><b>${escapeHtml(r.teacher||'예약')}</b>${escapeHtml(lesson)}${r.experiment?`<br>${escapeHtml(r.experiment)}`:''}</div>`}else{html+=`<button class="add-btn" data-date="${date}" data-day="${dayIndex}" data-period="${period}" aria-label="${date} ${period}교시 예약">+</button>`}html+='</div></td>'}html+='</tr>'}
  html+='</tbody></table>';$('scheduleArea').innerHTML=html;document.querySelectorAll('.add-btn').forEach(btn=>btn.addEventListener('click',()=>openReservation(btn.dataset.date,Number(btn.dataset.day),Number(btn.dataset.period))))
}

async function fetchInitData(showToast=false){setStatus('연결 중','warn');try{const data=await apiGet('getInitData');reservations=Array.isArray(data.reservations)?data.reservations:[];teachers=Array.isArray(data.teachers)?data.teachers:[];importedSchedules=Array.isArray(data.importedSchedules)?data.importedSchedules:[];renderSchedule();setStatus('공유 연결됨');showConnectionNotice('');if(data.apiVersion&&data.apiVersion!==EXPECTED_API_VERSION){setStatus('버전 확인 필요','warn');showConnectionNotice(`<b>Apps Script 버전이 다릅니다.</b> 현재 서버: ${escapeHtml(data.apiVersion)} / 필요한 버전: ${EXPECTED_API_VERSION}. Code.gs를 교체하고 새 버전으로 재배포해 주세요.`)}if(showToast)toast('공유 예약 현황을 새로고침했습니다.')}catch(error){const message=normalizeApiError(error);console.error(error);setStatus('연결 오류','error');showConnectionNotice(`<b>Google Apps Script 연결 오류</b><br>${escapeHtml(message)}`);if(showToast)toast(message,true);renderSchedule()}}

function openReservation(date,dayIndex,period){selectedSlot={date,dayIndex,period,room:currentRoom};selectedTeacher='';selectedLessons=[];$('reservationSummary').innerHTML=`<b>${escapeHtml(currentRoom)}</b><br>${escapeHtml(date)} (${DAYS[dayIndex]}요일) · ${period}교시`;$('teacherScheduleStatus').className='slot-info empty';$('teacherScheduleStatus').textContent='교사를 선택하면 이 시간에 수업이 있는지 표시됩니다.';$('scheduledLessonFields').style.display='none';$('manualTeacherFields').style.display='none';$('manualLessonFields').style.display='none';$('scheduledLessonSelect').innerHTML='<option value="">수업을 선택하세요</option>';$('manualTeacherInput').value='';$('manualSubjectInput').value='';$('manualClassInput').value='';$('experimentInput').value='';renderTeacherButtons();openModal('reservationModal')}
function teacherNameOf(item){return typeof item==='string'?item:String(item.name||'')}
function renderTeacherButtons(){let html='';teachers.forEach((teacher,index)=>{const name=teacherNameOf(teacher);if(name)html+=`<button class="teacher-choice c${index%8}" data-teacher="${escapeHtml(name)}">${escapeHtml(name)}</button>`});html+=`<button class="teacher-choice manual" data-teacher="__manual__">직접 입력</button>`;$('teacherButtonGrid').innerHTML=html;document.querySelectorAll('.teacher-choice').forEach(btn=>btn.addEventListener('click',()=>chooseTeacher(btn.dataset.teacher,btn)))}
function chooseTeacher(teacher,button){document.querySelectorAll('.teacher-choice').forEach(btn=>btn.classList.remove('active'));button.classList.add('active');$('scheduledLessonFields').style.display='none';$('manualTeacherFields').style.display='none';$('manualLessonFields').style.display='none';$('scheduledLessonSelect').innerHTML='<option value="">수업을 선택하세요</option>';if(teacher==='__manual__'){selectedTeacher='__manual__';selectedLessons=[];$('teacherScheduleStatus').className='slot-info empty';$('teacherScheduleStatus').innerHTML='등록 교사가 아닌 경우 교사명과 수업을 직접 입력할 수 있습니다.';$('manualTeacherFields').style.display='block';$('manualLessonFields').style.display='block';return}selectedTeacher=teacher;selectedLessons=importedSchedules.filter(s=>String(s.teacher)===teacher&&Number(s.dayIndex)===Number(selectedSlot.dayIndex)&&Number(s.period)===Number(selectedSlot.period));if(selectedLessons.length){$('teacherScheduleStatus').className='slot-info positive';$('teacherScheduleStatus').innerHTML=`<b>${escapeHtml(teacher)}</b> 선생님은 이 시간에 수업이 있습니다.`;$('scheduledLessonFields').style.display='block';$('scheduledLessonSelect').innerHTML='<option value="">수업을 선택하세요</option>'+selectedLessons.map((lesson,index)=>{const label=[lesson.subject,lesson.className].filter(Boolean).join(' · ')||'수업';return `<option value="${index}">${escapeHtml(label)}</option>`}).join('')}else{$('teacherScheduleStatus').className='slot-info negative';$('teacherScheduleStatus').innerHTML=`<b>${escapeHtml(teacher)}</b> 선생님은 이 시간에 등록된 수업이 없습니다.<br>과목과 학급을 직접 입력하여 예약할 수 있습니다.`;$('manualLessonFields').style.display='block'}}

$('saveReservationBtn').addEventListener('click',async()=>{if(!selectedSlot)return;let teacher='',subject='',className='';if(selectedTeacher==='__manual__'){teacher=$('manualTeacherInput').value.trim();subject=$('manualSubjectInput').value.trim();className=$('manualClassInput').value.trim();if(!teacher){toast('교사명을 입력해 주세요.',true);return}}else{if(!selectedTeacher){toast('교사를 먼저 선택해 주세요.',true);return}teacher=selectedTeacher;if(selectedLessons.length){const selectedIndex=$('scheduledLessonSelect').value;if(selectedIndex===''){toast('수업을 선택해 주세요.',true);return}const lesson=selectedLessons[Number(selectedIndex)];subject=lesson.subject||'';className=lesson.className||''}else{subject=$('manualSubjectInput').value.trim();className=$('manualClassInput').value.trim()}}const experiment=$('experimentInput').value.trim();if(!experiment){toast('실험 내용을 입력해 주세요.',true);return}const btn=$('saveReservationBtn');btn.disabled=true;btn.textContent='저장 중...';try{await apiPost('saveReservation',{...selectedSlot,teacher,subject,className,experiment});closeModal('reservationModal');await fetchInitData(false);toast('공유 예약이 완료되었습니다.')}catch(error){toast(normalizeApiError(error),true)}finally{btn.disabled=false;btn.textContent='예약하기'}})

$('adminBtn').addEventListener('click',()=>{$('adminPasswordInput').value='';openModal('adminLoginModal');setTimeout(()=>$('adminPasswordInput').focus(),50)});$('adminPasswordInput').addEventListener('keydown',event=>{if(event.key==='Enter')$('adminLoginBtn').click()});
$('adminLoginBtn').addEventListener('click',async()=>{const password=$('adminPasswordInput').value;if(!password){toast('비밀번호를 입력해 주세요.',true);return}const btn=$('adminLoginBtn');btn.disabled=true;btn.textContent='확인 중...';try{const check=await apiPost('verifyAdmin',{password});if(!check.valid)throw new Error('관리자 비밀번호가 올바르지 않습니다.');adminPasswordSession=password;await loadAdminData();closeModal('adminLoginModal');openAdminPanel('teachersPanel');openModal('adminModal')}catch(error){toast(normalizeApiError(error),true)}finally{btn.disabled=false;btn.textContent='확인'}})
async function loadAdminData(){const data=await apiPost('getAdminData',{password:adminPasswordSession});teachers=Array.isArray(data.teachers)?data.teachers:[];importedSchedules=Array.isArray(data.importedSchedules)?data.importedSchedules:[];reservations=Array.isArray(data.reservations)?data.reservations:[];renderTeacherList();renderSchedulePreview();renderReservationAdmin();renderSchedule()}
function openAdminPanel(panelId){document.querySelectorAll('.admin-tab').forEach(btn=>btn.classList.toggle('active',btn.dataset.panel===panelId));document.querySelectorAll('.admin-panel').forEach(panel=>panel.style.display=panel.id===panelId?'block':'none')}
document.querySelectorAll('.admin-tab').forEach(btn=>btn.addEventListener('click',()=>openAdminPanel(btn.dataset.panel)));
function renderTeacherList(){if(!teachers.length){$('teacherList').innerHTML='<div class="preview-empty">등록된 과학 교사가 없습니다.</div>';return}$('teacherList').innerHTML=teachers.map((teacher,index)=>{const name=teacherNameOf(teacher);const scheduleCount=typeof teacher==='object'?Number(teacher.scheduleCount||0):0;const importedAt=typeof teacher==='object'?String(teacher.importedAt||''):'';return `<div class="teacher-item"><div class="teacher-main"><button class="teacher-choice c${index%8}" style="cursor:default">${escapeHtml(name)}</button><div class="teacher-meta">불러온 수업 ${scheduleCount}건${importedAt?' · '+escapeHtml(importedAt):''}</div></div><button class="btn small import-teacher" data-name="${escapeHtml(name)}">시간표 불러오기</button><button class="btn small preview-teacher" data-name="${escapeHtml(name)}">보기</button><button class="btn danger small delete-teacher" data-name="${escapeHtml(name)}">삭제</button></div>`}).join('');document.querySelectorAll('.import-teacher').forEach(btn=>btn.addEventListener('click',()=>importTeacher(btn.dataset.name)));document.querySelectorAll('.preview-teacher').forEach(btn=>btn.addEventListener('click',()=>{openAdminPanel('schedulePanel');renderSchedulePreview(btn.dataset.name)}));document.querySelectorAll('.delete-teacher').forEach(btn=>btn.addEventListener('click',()=>deleteTeacher(btn.dataset.name)))}
$('addTeacherBtn').addEventListener('click',async()=>{const name=$('newTeacherInput').value.trim();if(!name){toast('교사 이름을 입력해 주세요.',true);return}try{await apiPost('addTeacher',{password:adminPasswordSession,name});$('newTeacherInput').value='';await loadAdminData();toast(`${name} 교사를 추가했습니다.`)}catch(error){toast(normalizeApiError(error),true)}})
async function deleteTeacher(name){if(!confirm(`${name} 교사를 현재 과학 교사 명단에서 삭제할까요?\n불러온 시간표도 함께 삭제됩니다.`))return;try{await apiPost('deleteTeacher',{password:adminPasswordSession,name});await loadAdminData();toast('교사를 삭제했습니다.')}catch(error){toast(normalizeApiError(error),true)}}
async function importTeacher(name){try{const data=await apiPost('importTeacherSchedule',{password:adminPasswordSession,name});await loadAdminData();openAdminPanel('schedulePanel');renderSchedulePreview(name);toast(`${name} 시간표 ${Number(data.count||0)}건을 불러왔습니다.`)}catch(error){toast(normalizeApiError(error),true)}}
$('importAllBtn').addEventListener('click',async()=>{const btn=$('importAllBtn');btn.disabled=true;btn.textContent='불러오는 중...';try{const data=await apiPost('importAllTeacherSchedules',{password:adminPasswordSession});await loadAdminData();const failed=Array.isArray(data.results)?data.results.filter(x=>!x.ok):[];if(failed.length)toast(`총 ${Number(data.count||0)}건 불러옴. 실패 교사: ${failed.map(x=>x.name).join(', ')}`,true);else toast(`전체 시간표 ${Number(data.count||0)}건을 불러왔습니다.`)}catch(error){toast(normalizeApiError(error),true)}finally{btn.disabled=false;btn.textContent='전체 시간표 불러오기'}})
function renderSchedulePreview(filterTeacher=''){const rows=importedSchedules.filter(x=>!filterTeacher||String(x.teacher)===filterTeacher).sort((a,b)=>String(a.teacher).localeCompare(String(b.teacher),'ko')||Number(a.dayIndex)-Number(b.dayIndex)||Number(a.period)-Number(b.period));if(!rows.length){$('schedulePreview').innerHTML='<div class="preview-empty">불러온 시간표가 없습니다.</div>';return}let html='<table><thead><tr><th>교사</th><th>요일</th><th>교시</th><th>과목</th><th>학급</th></tr></thead><tbody>';rows.forEach(row=>{html+=`<tr><td>${escapeHtml(row.teacher)}</td><td>${DAYS[Number(row.dayIndex)]||''}요일</td><td>${escapeHtml(row.period)}교시</td><td>${escapeHtml(row.subject||'')}</td><td>${escapeHtml(row.className||'')}</td></tr>`});html+='</tbody></table>';$('schedulePreview').innerHTML=html}
function renderReservationAdmin(){if(!reservations.length){$('reservationAdminList').innerHTML='<div class="preview-empty">예약 내역이 없습니다.</div>';return}const rows=[...reservations].sort((a,b)=>String(b.date).localeCompare(String(a.date))||Number(a.period)-Number(b.period));let html='<table><thead><tr><th>날짜</th><th>실</th><th>교시</th><th>교사</th><th>수업</th><th>실험 내용</th><th>관리</th></tr></thead><tbody>';rows.forEach(row=>{html+=`<tr><td>${escapeHtml(row.date)}</td><td>${escapeHtml(row.room||'과학1실')}</td><td>${escapeHtml(row.period)}교시</td><td>${escapeHtml(row.teacher||'')}</td><td>${escapeHtml([row.subject,row.className].filter(Boolean).join(' · '))}</td><td>${escapeHtml(row.experiment||'')}</td><td><button class="btn danger small delete-reservation" data-id="${escapeHtml(row.id)}">삭제</button></td></tr>`});html+='</tbody></table>';$('reservationAdminList').innerHTML=html;document.querySelectorAll('.delete-reservation').forEach(btn=>btn.addEventListener('click',()=>deleteReservation(btn.dataset.id)))}
async function deleteReservation(id){if(!confirm('이 예약을 삭제할까요?'))return;try{await apiPost('deleteReservation',{password:adminPasswordSession,id});await loadAdminData();toast('예약을 삭제했습니다.')}catch(error){toast(normalizeApiError(error),true)}}
$('changePasswordBtn').addEventListener('click',async()=>{const p1=$('newAdminPasswordInput').value,p2=$('confirmAdminPasswordInput').value;if(!p1||p1.length<4){toast('새 비밀번호를 4자 이상 입력해 주세요.',true);return}if(p1!==p2){toast('새 비밀번호가 서로 다릅니다.',true);return}try{await apiPost('changeAdminPassword',{password:adminPasswordSession,newPassword:p1});adminPasswordSession=p1;$('newAdminPasswordInput').value='';$('confirmAdminPasswordInput').value='';toast('관리자 비밀번호를 변경했습니다.')}catch(error){toast(normalizeApiError(error),true)}})

document.querySelectorAll('.room-tab').forEach(btn=>btn.addEventListener('click',()=>{currentRoom=btn.dataset.room;document.querySelectorAll('.room-tab').forEach(other=>other.classList.toggle('active',other.dataset.room===currentRoom));renderSchedule()}));
$('prevWeekBtn').addEventListener('click',()=>{currentMonday=addDays(currentMonday,-7);renderSchedule()});$('nextWeekBtn').addEventListener('click',()=>{currentMonday=addDays(currentMonday,7);renderSchedule()});$('todayBtn').addEventListener('click',()=>{currentMonday=getMonday(new Date());renderSchedule()});$('datePicker').addEventListener('change',event=>{if(!event.target.value)return;currentMonday=getMonday(parseDateLocal(event.target.value));renderSchedule()});$('refreshBtn').addEventListener('click',()=>fetchInitData(true));
document.querySelectorAll('[data-close]').forEach(btn=>btn.addEventListener('click',()=>closeModal(btn.dataset.close)));document.querySelectorAll('.modal-backdrop').forEach(backdrop=>backdrop.addEventListener('click',event=>{if(event.target===backdrop)closeModal(backdrop.id)}));
renderSchedule();fetchInitData(false);setInterval(()=>{if(document.visibilityState==='visible')fetchInitData(false)},60000);
</script>
</body>
