<!DOCTYPE html>

<head>

</head>

<script>
'use strict';

// ★ 여기에 본인의 구글 스크립트 웹앱 주소를 입력하세요.
const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwf5RrRp9RLhEbAhef_DeMHO8krir58j6NtyeDorNT11uQCMycX5xm8smVKTPb6RdoI/exec';
const ROOMS = ['과학1실', '과학2실'];

const PALETTE = [
  { bg:'bg-emerald-100 hover:bg-emerald-200', border:'border-emerald-400', text:'text-emerald-900', badge:'bg-emerald-500', ring:'ring-emerald-500' },
  { bg:'bg-sky-100 hover:bg-sky-200', border:'border-sky-400', text:'text-sky-900', badge:'bg-sky-500', ring:'ring-sky-500' },
  { bg:'bg-purple-100 hover:bg-purple-200', border:'border-purple-400', text:'text-purple-900', badge:'bg-purple-500', ring:'ring-purple-500' },
  { bg:'bg-amber-100 hover:bg-amber-200', border:'border-amber-400', text:'text-amber-900', badge:'bg-amber-500', ring:'ring-amber-500' },
  { bg:'bg-rose-100 hover:bg-rose-200', border:'border-rose-400', text:'text-rose-900', badge:'bg-rose-500', ring:'ring-rose-500' },
  { bg:'bg-indigo-100 hover:bg-indigo-200', border:'border-indigo-400', text:'text-indigo-900', badge:'bg-indigo-500', ring:'ring-indigo-500' }
];

function getMonday(d) {
  const date = new Date(d);
  date.setHours(12,0,0,0);
  const day = date.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  return date;
}

function addDays(date, days) {
  const result = new Date(date);
  result.setDate(result.getDate() + days);
  return result;
}

function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
  }[c]));
}

function setSyncStatus(state, message) {
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  const status = document.getElementById('syncStatus');

  if (!status) return;
  if (dot) {
    if (state === 'loading') {
      dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400 mr-1 animate-pulse flex-shrink-0';
    } else if (state === 'ok') {
      dot.className = 'w-1.5 h-1.5 rounded-full bg-teal-300 mr-1 flex-shrink-0';
    } else {
      dot.className = 'w-1.5 h-1.5 rounded-full bg-red-300 mr-1 flex-shrink-0';
    }
  }
  if (text) text.textContent = message;
  else status.textContent = message;
}

let activeTeachers = ['이서연','손아영','이정훈','정혜정'];
let timetables = {};
let reservations = [];
let currentMonday = getMonday(new Date());
let currentRoom = ROOMS[0];

let selectedSlot = null;
let selectedTeacher = null;
let activeDetailId = null;
let adminSessionPassword = '';

async function apiGet(action, params = {}) {
  const url = new URL(GOOGLE_APPS_SCRIPT_URL);
  url.searchParams.set('action', action);
  url.searchParams.set('_', Date.now());
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));

  const response = await fetch(url.toString(), {
    method: 'GET',
    cache: 'no-store',
    redirect: 'follow'
  });

  const data = await response.json();
  if (!response.ok || data.ok === false) throw new Error(data.error || `서버 오류 ${response.status}`);
  return data;
}

async function apiPost(action, payload = {}) {
  const response = await fetch(GOOGLE_APPS_SCRIPT_URL, {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });

  const data = await response.json();
  if (!response.ok || data.ok === false) throw new Error(data.error || `서버 오류 ${response.status}`);
  return data;
}

async function fetchInitData(silent = false) {
  try {
    setSyncStatus('loading', '공유 데이터 동기화 중...');
    const data = await apiGet('getInitData');

    activeTeachers = Array.isArray(data.activeTeachers) ? data.activeTeachers : activeTeachers;
    timetables = data.timetables || {};
    reservations = Array.isArray(data.reservations) ? data.reservations : [];

    setSyncStatus('ok', '공유 데이터 동기화 완료');
    renderUI();
  } catch (error) {
    console.error('데이터 동기화 실패:', error);
    setSyncStatus('error', '연결 실패: ' + String(error.message || error));
    if (!silent) alert('Google Sheet 연결에 실패했습니다.\n' + String(error.message || error));
    renderUI();
  }
}

function getTeacherColor(name) {
  const idx = activeTeachers.indexOf(name);
  return PALETTE[idx >= 0 ? idx % PALETTE.length : 0];
}

function renderRoomTabs() {
  const div = document.getElementById('roomTabs');
  div.innerHTML = '';

  ROOMS.forEach(room => {
    const active = room === currentRoom;
    const count = reservations.filter(r => (r.room || '과학1실') === room).length;

    div.innerHTML += `
      <button onclick="selectRoom('${room}')"
        class="flex-1 md:flex-none px-3 py-3 rounded-xl text-xs font-bold border transition text-center md:text-left
          ${active ? 'bg-teal-600 text-white border-teal-600 shadow-md' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">
        <span>🧪 ${room}</span>
        <span class="block text-[10px] font-normal ${active ? 'text-teal-100' : 'text-slate-400'} mt-0.5">
          ${count}건
        </span>
      </button>`;
  });
}

function selectRoom(room) {
  currentRoom = room;
  renderUI();
}

function renderUI() {
  renderRoomTabs();

  const legendDiv = document.getElementById('teacherLegends');
  legendDiv.innerHTML = '<span class="font-semibold text-slate-500 mr-1">과학과:</span>';

  activeTeachers.forEach(t => {
    const color = getTeacherColor(t);
    let count = 0;
    if (timetables[t]) {
      Object.values(timetables[t]).forEach(day => {
        Object.values(day || {}).forEach(cls => {
          if (cls) count++;
        });
      });
    }

    legendDiv.innerHTML += `
      <span class="inline-flex items-center font-medium ${color.text} mr-1">
        <span class="w-2.5 h-2.5 rounded-full ${color.badge} mr-1"></span>
        ${escapeHtml(t)}(${count})
      </span>`;
  });

  const fri = addDays(currentMonday, 4);
  document.getElementById('currentWeekRange').innerText =
    `${currentMonday.getFullYear()}.${currentMonday.getMonth()+1}.${currentMonday.getDate()} ~ ${fri.getMonth()+1}.${fri.getDate()}`;

  document.getElementById('datePicker').value = formatDate(currentMonday);
  document.getElementById('statLabel').innerText = `이번 주 예약 (${currentRoom})`;

  const dayNames = ['월','화','수','목','금'];
  const thead = document.getElementById('tableHeader');
  thead.innerHTML = '<th class="p-2 sm:p-3 text-center w-16 sm:w-20 bg-slate-100 sticky left-0 z-20 border-r border-slate-200">교시</th>';

  for (let i=0;i<5;i++) {
    const d = addDays(currentMonday, i);
    const isToday = formatDate(d) === formatDate(new Date());
    thead.innerHTML += `
      <th class="p-2 sm:p-3 text-center w-1/5 ${isToday ? 'bg-teal-50 text-teal-800' : ''}">
        ${dayNames[i]}
        <span class="block text-[10px] sm:text-xs font-normal text-slate-500">
          ${d.getMonth()+1}/${d.getDate()}
        </span>
      </th>`;
  }

  const tbody = document.getElementById('timetableBody');
  tbody.innerHTML = '';
  let totalRes = 0;

  for (let period=1;period<=7;period++) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="p-1.5 sm:p-2 text-center border-r border-slate-200 bg-slate-50 font-bold text-slate-800 text-xs sm:text-sm sticky left-0 z-10">${period}교시</td>`;

    for (let dayIdx=0;dayIdx<5;dayIdx++) {
      const dateStr = formatDate(addDays(currentMonday, dayIdx));
      const res = reservations.find(r => r.date === dateStr && Number(r.period) === period && (r.room || '과학1실') === currentRoom);

      const td = document.createElement('td');
      td.className = 'p-1 sm:p-1.5 border-r border-b border-slate-200 align-top';

      if (res) {
        totalRes++;
        const c = getTeacherColor(res.teacher);
        td.innerHTML = `
          <button onclick="openDetailModal('${res.id}')"
            class="slot-button w-full p-1.5 sm:p-2 rounded-xl border ${c.border} ${c.bg} ${c.text} flex flex-col justify-between text-left">
            <div class="font-bold text-[11px] sm:text-xs">
              <span class="w-1.5 h-1.5 rounded-full ${c.badge} inline-block mr-1"></span>
              ${escapeHtml(res.teacher)}
            </div>
            <div class="font-semibold text-[10px] sm:text-xs text-slate-800 line-clamp-2">
              ${escapeHtml(res.gradeClass || '')}
            </div>
            ${res.topic ? `<div class="text-[9px] sm:text-[10px] opacity-80 line-clamp-2">🔬 ${escapeHtml(res.topic)}</div>` : ''}
          </button>`;
      } else {
        td.innerHTML = `
          <button onclick="openReservationModal('${dateStr}', ${dayIdx}, ${period})"
            class="slot-button w-full rounded-xl border border-dashed border-slate-200 hover:border-teal-400 hover:bg-teal-50/50 flex items-center justify-center text-slate-300 hover:text-teal-600 group"
            aria-label="${dateStr} ${period}교시 예약">
            <span class="text-2xl font-light group-hover:scale-110 transition">+</span>
          </button>`;
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  document.getElementById('statTotal').innerText = `${totalRes}건`;
}

function openReservationModal(dateStr, dayIdx, period) {
  selectedSlot = { dateStr, dayIdx, period, room: currentRoom };
  selectedTeacher = null;

  document.getElementById('modalTargetDateTime').innerText = `${dateStr} ${period}교시 · ${currentRoom}`;
  document.getElementById('inputTopic').value = '';
  document.getElementById('inputCustomClass').value = '';

  const info = document.getElementById('teacherScheduleInfo');
  info.classList.add('hidden');
  info.innerHTML = '';

  const customBox = document.getElementById('customClassBox');
  customBox.classList.add('hidden');

  const tBtns = document.getElementById('teacherButtons');
  tBtns.innerHTML = '';

  activeTeachers.forEach(t => {
    const c = getTeacherColor(t);
    tBtns.innerHTML += `
      <button onclick="selectTeacher('${escapeHtml(t)}', this)"
        class="teacher-btn p-2.5 rounded-xl border ${c.border} ${c.bg} ${c.text} font-bold text-xs shadow-sm">
        <span class="w-2 h-2 rounded-full ${c.badge} inline-block mr-1"></span>
        ${escapeHtml(t)}
      </button>`;
  });

  document.getElementById('selectClass').innerHTML = '<option value="">교사를 먼저 선택하세요</option>';
  openModal('modalReservation');
}

function selectTeacher(teacherName, btnEl) {
  selectedTeacher = teacherName;

  document.querySelectorAll('#teacherButtons button').forEach(b => {
    b.classList.remove('ring-4','ring-offset-1');
  });
  btnEl.classList.add('ring-4','ring-offset-1');

  const sel = document.getElementById('selectClass');
  const info = document.getElementById('teacherScheduleInfo');
  const customBox = document.getElementById('customClassBox');

  sel.innerHTML = '';
  customBox.classList.add('hidden');
  document.getElementById('inputCustomClass').value = '';

  const schedule = timetables[teacherName] || {};
  const scheduledClass = (schedule[selectedSlot.dayIdx] || {})[selectedSlot.period];

  if (scheduledClass) {
    info.className = 'p-3 rounded-xl text-xs border bg-emerald-50 border-emerald-200 text-emerald-800';
    info.innerHTML = `<b>${escapeHtml(teacherName)}</b> 선생님은 이 시간에 수업이 있습니다.<br><span class="font-bold">시간표: ${escapeHtml(scheduledClass)}</span>`;
    sel.innerHTML += `<option value="${escapeHtml(scheduledClass)}" selected>⭐ ${escapeHtml(scheduledClass)}</option>`;
  } else {
    info.className = 'p-3 rounded-xl text-xs border bg-amber-50 border-amber-200 text-amber-800';
    info.innerHTML = `<b>${escapeHtml(teacherName)}</b> 선생님은 이 시간에 등록된 수업이 없습니다.<br>직접 입력으로도 예약할 수 있습니다.`;
    sel.innerHTML += '<option value="CUSTOM" selected>✏️ 직접 입력</option>';
    customBox.classList.remove('hidden');
  }

  const otherClasses = new Set();
  Object.values(schedule).forEach(day => {
    Object.values(day || {}).forEach(c => {
      if (c && c !== scheduledClass) otherClasses.add(c);
    });
  });

  if (otherClasses.size > 0) {
    const grp = document.createElement('optgroup');
    grp.label = '이 교사의 다른 등록 수업';
    otherClasses.forEach(c => {
      const option = document.createElement('option');
      option.value = c;
      option.textContent = c;
      grp.appendChild(option);
    });
    sel.appendChild(grp);
  }

  if (scheduledClass) {
    const option = document.createElement('option');
    option.value = 'CUSTOM';
    option.textContent = '✏️ 직접 입력';
    sel.appendChild(option);
  }
  info.classList.remove('hidden');
}

document.getElementById('selectClass').addEventListener('change', e => {
  const customBox = document.getElementById('customClassBox');
  if (e.target.value === 'CUSTOM') customBox.classList.remove('hidden');
  else customBox.classList.add('hidden');
});

async function saveReservation() {
  if (!selectedTeacher) { alert('교사를 선택하세요.'); return; }
  let cls = document.getElementById('selectClass').value;
  if (!cls) { alert('수업을 선택하세요.'); return; }
  if (cls === 'CUSTOM') {
    cls = document.getElementById('inputCustomClass').value.trim();
    if (!cls) { alert('수업/행사명을 직접 입력하세요.'); return; }
  }

  const topic = document.getElementById('inputTopic').value.trim();
  const button = document.getElementById('btnSaveRes');

  button.disabled = true;
  button.innerText = '저장 중...';

  const newRes = {
    date: selectedSlot.dateStr,
    period: selectedSlot.period,
    room: selectedSlot.room,
    teacher: selectedTeacher,
    gradeClass: cls,
    topic
  };

  try {
    await apiPost('saveReservation', newRes);
    closeModal('modalReservation');
    await fetchInitData(true);
    alert('예약이 저장되었습니다.');
  } catch (error) {
    console.error(error);
    alert('예약 저장 실패: ' + error.message);
  } finally {
    button.disabled = false;
    button.innerText = '예약 확정';
  }
}

function openDetailModal(id) {
  activeDetailId = id;
  const res = reservations.find(r => r.id === id);
  if (!res) return;

  document.getElementById('detailDateTime').innerText = `${res.date} ${res.period}교시`;
  document.getElementById('detailRoom').innerText = res.room || '과학1실';
  document.getElementById('detailTeacher').innerText = res.teacher || '-';
  document.getElementById('detailClass').innerText = res.gradeClass || '-';
  document.getElementById('detailTopic').innerText = res.topic || '-';

  openModal('modalDetail');
}

async function deleteReservation() {
  if (!activeDetailId) return;
  if (!confirm('예약을 삭제할까요?')) return;
  
  let pwd = adminSessionPassword;
  if (!pwd) {
    pwd = prompt('예약을 취소하려면 관리자(또는 등록) 비밀번호를 입력하세요.');
    if (!pwd) return; 
  }

  const button = document.getElementById('btnDelRes');
  button.disabled = true;
  button.innerText = '삭제 중...';

  try {
    await apiPost('deleteReservation', { id: activeDetailId, password: pwd });
    closeModal('modalDetail');
    await fetchInitData(true);
  } catch (error) {
    console.error(error);
    alert('예약 삭제 실패: ' + error.message);
  } finally {
    button.disabled = false;
    button.innerText = '🗑️ 예약 취소';
  }
}

function openAdminAuthModal() {
  document.getElementById('adminPwInput').value = '';
  document.getElementById('btnSaveAdmin').classList.add('hidden');
  openModal('modalAdminAuth');
  setTimeout(() => { document.getElementById('adminPwInput').focus(); }, 50);
}

async function verifyAdmin() {
  const password = document.getElementById('adminPwInput').value;
  if (!password) { alert('비밀번호를 입력하세요.'); return; }

  try {
    const data = await apiPost('verifyAdmin', { password });
    if (!data.valid) { alert('비밀번호가 틀렸습니다.'); return; }

    adminSessionPassword = password;
    closeModal('modalAdminAuth');
    
    document.getElementById('inputTeachers').value = activeTeachers.join(', ');
    document.getElementById('syncResultBox').classList.add('hidden');
    
    openModal('modalAdminSettings');
  } catch (error) {
    alert('관리자 인증 실패: ' + error.message);
  }
}

async function syncTimetablesFromSheet() {
  if (!adminSessionPassword) { alert('관리자 인증이 필요합니다.'); return; }
  
  const newTeachers = document.getElementById('inputTeachers').value.split(',').map(s => s.trim()).filter(Boolean);
  if (newTeachers.length === 0) { alert('교사 이름을 1명 이상 입력하세요.'); return; }

  const button = document.getElementById('btnSync');
  button.disabled = true;
  button.innerText = '⏳ 구글 시트 데이터 스캔 중...'; 

  try {
    const rawDataResponse = await apiPost('getRawSheets', { password: adminSessionPassword });
    const fetchedRawSheets = rawDataResponse.rawSheets || [];

    button.innerText = '⏳ 시간표 정밀 분석 중...';
    await new Promise(resolve => setTimeout(resolve, 50));

    const parsedData = parseRawSheetsForTeachers(fetchedRawSheets, newTeachers);
    
    let newTimetables = {};
    let resultHtml = '<div class="font-bold text-teal-800 mb-2">분석 결과</div><div class="grid grid-cols-1 sm:grid-cols-2 gap-2">';

    newTeachers.forEach(teacher => {
      const item = parsedData.results[teacher];
      if (item && item.count > 0) {
        newTimetables[teacher] = item.schedule;
        resultHtml += `
          <div class="p-2 bg-emerald-50 border border-emerald-200 rounded text-emerald-800">
            ✅ ${escapeHtml(teacher)}
            <span class="float-right font-bold">${item.count}시간</span>
            <div class="clear-both text-[9px] mt-1">추출 완료</div>
          </div>`;
      } else {
        resultHtml += `
          <div class="p-2 bg-amber-50 border border-amber-200 rounded text-amber-800">
            ⚠️ ${escapeHtml(teacher)}
            <span class="float-right">0시간</span>
            <div class="clear-both text-[9px] mt-1">시간표를 찾지 못함</div>
          </div>`;
      }
    });

    resultHtml += '</div>';

    const resultBox = document.getElementById('syncResultBox');
    resultBox.innerHTML = resultHtml;
    resultBox.classList.remove('hidden');

    window.previewTeachers = newTeachers;
    window.previewTimetables = newTimetables;

    document.getElementById('btnSaveAdmin').classList.remove('hidden');

  } catch (error) {
    console.error(error);
    alert('시간표 동기화 실패: ' + String(error.message || error));
  } finally {
    button.disabled = false;
    button.innerText = '🔍 시트 탭에서 시간표 자동 추출';
  }
}

async function saveAdminSettings() {
  if (!adminSessionPassword) return;

  const btn = document.getElementById('btnSaveAdmin');
  btn.disabled = true;
  btn.innerText = '저장 중...';

  try {
    await apiPost('saveSettings', {
      password: adminSessionPassword,
      activeTeachers: window.previewTeachers || activeTeachers,
      timetables: window.previewTimetables || timetables
    });

    activeTeachers = window.previewTeachers || activeTeachers;
    timetables = window.previewTimetables || timetables;

    alert('설정이 저장되었습니다.');
    closeModal('modalAdminSettings');
    renderUI();
  } catch (error) {
    alert('설정 저장 실패: ' + error.message);
  } finally {
    btn.disabled = false;
    btn.innerText = '💾 설정 저장';
    btn.classList.add('hidden');
  }
}

// 병합된 셀(빈 행)을 만나더라도 이전 교시를 기억하여 데이터를 수집하는 구조
function parseRawSheetsForTeachers(rawSheets, targetTeachers) {
  function cleanText(value) { return String(value ?? '').replace(/\u200B/g, '').replace(/\uFEFF/g, '').replace(/\r/g, '').trim(); }

  function findTeacherSheet(teacher) {
    const cleanTeacher = teacher.replace(/\s+/g, '');
    let sheet = rawSheets.find(s => s.name.replace(/\s+/g, '').includes(cleanTeacher));
    if (sheet) return { sheet, matchedBy: '탭 이름 매칭' };

    for (let s of rawSheets) {
      const rows = Array.isArray(s.values) ? s.values : [];
      for (let r = 0; r < Math.min(rows.length, 10); r++) {
        for (let c = 0; c < Math.min((rows[r]||[]).length, 10); c++) {
          const cellVal = String(rows[r][c] || '').replace(/\s+/g, '');
          if (cellVal.includes(cleanTeacher)) {
            return { sheet: s, matchedBy: '시트 내부 셀 매칭' };
          }
        }
      }
    }
    return { sheet: null, matchedBy: '' };
  }

  function dayIndexFromCell(value) {
    const text = String(value ?? '').replace(/\s/g, '');
    if (!text) return -1;
    if (text === '월' || text === '월요일' || text === '(월)' || text === '[월]') return 0;
    if (text === '화' || text === '화요일' || text === '(화)' || text === '[화]') return 1;
    if (text === '수' || text === '수요일' || text === '(수)' || text === '[수]') return 2;
    if (text === '목' || text === '목요일' || text === '(목)' || text === '[목]') return 3;
    if (text === '금' || text === '금요일' || text === '(금)' || text === '[금]') return 4;
    
    if (text.startsWith('월')) return 0;
    if (text.startsWith('화')) return 1;
    if (text.startsWith('수')) return 2;
    if (text.startsWith('목')) return 3;
    if (text.startsWith('금')) return 4;
    return -1;
  }

  function periodFromCell(value) {
    const text = String(value ?? '').replace(/\s/g, '');
    if (!text) return null;
    
    if (text.includes('1교시') || text === '1' || text === '(1)' || text === '[1]' || text === '①' || text === '1.') return 1;
    if (text.includes('2교시') || text === '2' || text === '(2)' || text === '[2]' || text === '②' || text === '2.') return 2;
    if (text.includes('3교시') || text === '3' || text === '(3)' || text === '[3]' || text === '③' || text === '3.') return 3;
    if (text.includes('4교시') || text === '4' || text === '(4)' || text === '[4]' || text === '④' || text === '4.') return 4;
    if (text.includes('5교시') || text === '5' || text === '(5)' || text === '[5]' || text === '⑤' || text === '5.') return 5;
    if (text.includes('6교시') || text === '6' || text === '(6)' || text === '[6]' || text === '⑥' || text === '6.') return 6;
    if (text.includes('7교시') || text === '7' || text === '(7)' || text === '[7]' || text === '⑦' || text === '7.') return 7;
    if (text.includes('8교시') || text === '8' || text === '(8)' || text === '[8]' || text === '⑧' || text === '8.') return 8;
    return null;
  }

  const sheetNames = rawSheets.map(s => String(s.name || ''));
  const results = {};

  targetTeachers.forEach(teacher => {
    const found = findTeacherSheet(teacher);
    const sheet = found.sheet;
    if (!sheet) {
      results[teacher] = { count: 0, schedule: {0:{},1:{},2:{},3:{},4:{}}, sheetName: '', matchedBy: '', reason: '교사 탭 없음' };
      return;
    }

    const rows = Array.isArray(sheet.values) ? sheet.values : [];
    const schedule = {0:{},1:{},2:{},3:{},4:{}};
    
    // 요일(월~금)이 적힌 헤더 행 찾기
    let headerRow = -1;
    let dayCols = { 0:-1, 1:-1, 2:-1, 3:-1, 4:-1 };

    for (let r = 0; r < Math.min(rows.length, 15); r++) {
      let tempCols = { 0:-1, 1:-1, 2:-1, 3:-1, 4:-1 };
      let foundCount = 0;
      for (let c = 0; c < (rows[r]||[]).length; c++) {
        const dIdx = dayIndexFromCell(rows[r][c]);
        if (dIdx >= 0 && tempCols[dIdx] === -1) {
          tempCols[dIdx] = c;
          foundCount++;
        }
      }
      if (foundCount >= 3) {
        headerRow = r;
        dayCols = tempCols;
        break;
      }
    }

    if (headerRow < 0) {
      results[teacher] = { count: 0, schedule, sheetName: sheet.name, matchedBy: found.matchedBy, reason: `헤더 없음` };
      return;
    }

    // 요일 열들의 가장 왼쪽 열 번호 (보통 교시는 이 왼쪽 어딘가에 있음)
    let firstDayCol = Math.max(...Object.values(dayCols).filter(v => v !== -1));
    for (let k in dayCols) {
      if (dayCols[k] !== -1 && dayCols[k] < firstDayCol) firstDayCol = dayCols[k];
    }

    let count = 0;
    let currentPeriod = null; // 병합된 셀(빈 칸)을 위해 교시 상태를 유지

    for (let r = headerRow + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      
      // 교시 확인 (행의 시작부분 탐색)
      let pVal = null;
      for (let c = 0; c < (firstDayCol > 0 ? firstDayCol : row.length); c++) {
        const p = periodFromCell(row[c]);
        if (p !== null) { pVal = p; break; }
      }

      if (pVal !== null) {
        currentPeriod = pVal;
      }

      if (currentPeriod === null) continue; // 교시를 찾기 전의 내용 무시

      // 현재 교시에 맞춰 수업 내용 읽기
      for (let dayIdx = 0; dayIdx < 5; dayIdx++) {
        const colIdx = dayCols[dayIdx];
        if (colIdx === -1 || !row[colIdx]) continue;

        const text = cleanText(row[colIdx]);
        if (!text) continue;

        // "과목\n학년-반" 형태 분리 (예: "과학A\n2-1" -> "2-1 과학A")
        let className = '';
        const lines = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
        const subjectParts = [];
        
        lines.forEach(line => {
          let m = line.match(/([1-3])\s*[-]\s*(\d{1,2})/);
          if (!m) m = line.match(/([1-3])\s*학년\s*(\d{1,2})\s*반/);
          if (m && !className) {
            className = `${m[1]}-${m[2]}`;
            const remainder = line.replace(m[0], '').trim();
            if (remainder) subjectParts.push(remainder);
          } else {
            subjectParts.push(line);
          }
        });
        
        const display = className ? `${className} ${subjectParts.join(' ')}`.trim() : text;

        if (schedule[dayIdx][currentPeriod]) {
          if (!schedule[dayIdx][currentPeriod].includes(display)) {
            schedule[dayIdx][currentPeriod] += ' ' + display;
          }
        } else {
          schedule[dayIdx][currentPeriod] = display;
          count++;
        }
      }
    }
    
    results[teacher] = { 
      count, 
      schedule, 
      sheetName: sheet.name, 
      matchedBy: found.matchedBy, 
      reason: count > 0 ? '정상' : '내용 없음' 
    };
  });

  return { results, sheetNames };
}

function navigateWeek(days) {
  currentMonday = addDays(currentMonday, days);
  renderUI();
}

function setThisWeek() {
  currentMonday = getMonday(new Date());
  renderUI();
}

  el.classList.remove('hidden');
  el.classList.add('flex');
}

function closeModal(id) {
  const el = document.getElementById(id);
  el.classList.add('hidden');
  el.classList.remove('flex');
}

  currentMonday = getMonday(picked);
  renderUI();
});

});

fetchInitData(true);
